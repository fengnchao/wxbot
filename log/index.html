<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>微信管家 · 管理台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/assets/dashboard.css">
<link rel="stylesheet" href="/assets/workflow.css">
</head>
<body>

<nav class="primary-nav" aria-label="主导航">
  <div class="brand"><span class="brand-mark">管</span><div>微信管家<small>运行管理台</small></div></div>
  <div class="nav-group"><h2>消息监控</h2>
    <button id="tab-workflow" class="on">实时工作流</button>
    <button id="tab-queue">收发队列</button>
  </div>
  <div class="nav-group"><h2>用户与任务</h2>
    <button id="tab-users">用户与记忆</button>
    <button id="tab-heartbeat">角色与心跳</button>
    <button id="tab-jobs">定时任务</button>
    <button id="tab-groups">用户分组</button>
  </div>
  <div class="nav-group"><h2>系统设置</h2><button id="tab-configuration">配置管理</button><button id="tab-telegram-relay">Telegram 转发</button></div>
  <div class="nav-foot">Butler / wxbot<br>本地管理 · 保存不自动重启</div>
</nav>
<div class="workspace">
<header>
  <div class="row">
    <h1 id="page-title">实时工作流</h1><span id="refresh-status" class="muted">等待载入</span>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="b-contacts" aria-expanded="true">收起列表</button>
    <button id="b-refresh">刷新</button>
    <button id="b-auto">自动刷新：关</button>
    <button id="j-showdone" class="hide">显示已完成</button>
    <select id="q-state" class="hide" aria-label="队列状态筛选">
      <option value="active">未完成任务</option><option value="all">全部状态</option>
      <option value="unbatched">待合并</option><option value="ready">待提交模型</option>
      <option value="processing">等待模型</option><option value="waiting_delivery">回复就绪</option>
      <option value="pending">待发送</option><option value="sending">键入中</option>
      <option value="confirming">发送确认中</option><option value="blocked">已阻断</option>
      <option value="uncertain">结果不确定</option><option value="done">整轮完成</option>
      <option value="sent">已发送</option><option value="skipped">已跳过</option>
    </select>
    <input id="c-search" class="hide" type="text" placeholder="搜索配置名称或值" aria-label="搜索配置">
    <input id="view-search" type="search" placeholder="搜索当前记录" aria-label="搜索当前记录">
    <button id="b-expand">展开本页</button><button id="b-collapse">收起本页</button>
    <span style="flex:1"></span>
  </div>
</header>

<main>
  <aside id="list"></aside>
  <section id="pane"><div class="empty">左侧选一项查看详情</div></section>
</main>
</div>

<script src="/assets/common.js"></script>
<script src="/assets/messages.js"></script>
<script src="/assets/jobs.js"></script>
<script src="/assets/groups.js"></script>
<script src="/assets/heartbeat.js"></script>
<script src="/assets/queue.js"></script>
<script src="/assets/configuration.js"></script>
<script src="/assets/users.js"></script>
<script src="/assets/workflow.js"></script>
<script src="/assets/telegram_relay.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
