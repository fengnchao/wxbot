<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>微信收件日志</title>
<style>
  :root{
    --bg:#0e1116; --bg2:#151a22; --bg3:#1b222c; --line:#263040;
    --fg:#d8e0ea; --fg2:#8b9bb0; --fg3:#5d6b7e;
    --wx:#3ddc97; --bot:#5aa9ff; --warn:#ff7a59; --ok:#3ddc97; --asst:#5aa9ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:13px/1.65 "Cascadia Mono","Consolas","Menlo","Microsoft YaHei",monospace}
  header{position:sticky;top:0;z-index:10;background:var(--bg2);
         border-bottom:1px solid var(--line);padding:10px 16px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  h1{font-size:15px;margin:0 12px 0 0;font-weight:600;letter-spacing:.5px}
  select,input[type=text],button{
    background:var(--bg3);color:var(--fg);border:1px solid var(--line);border-radius:6px;
    padding:5px 9px;font-size:12px;font-family:inherit;outline:none}
  input[type=text]:focus{border-color:var(--wx)}
  button{cursor:pointer}
  button:hover{border-color:var(--wx);color:#fff}
  button.on{background:#1d3a5c;border-color:var(--bot)}
  button.wx{border-color:#22553f}
  .chip{background:var(--bg3);border:1px solid var(--line);border-radius:20px;
        padding:3px 10px;font-size:11px;color:var(--fg2)}
  .chip b{color:var(--fg);font-weight:600}
  .tabs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .tabs button{padding:4px 16px;font-size:12px}
  .hide{display:none !important}

  main{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 100px)}
  aside{border-right:1px solid var(--line);overflow-y:auto;background:var(--bg2)}
  section{overflow-y:auto;padding:14px 18px 60px}

  .user{padding:9px 12px;border-bottom:1px solid #1c232e;cursor:pointer}
  .user:hover{background:#19212c}
  .user.sel{background:#17352a;border-left:3px solid var(--wx);padding-left:9px}
  .user .nm{font-size:13px;font-weight:600;color:var(--fg);
            display:flex;align-items:center;gap:6px}
  .user .nm .tag{font-size:9.5px;font-weight:400;border:1px solid #22553f;
                 color:var(--wx);border-radius:4px;padding:0 4px}
  .user .uid{font-size:10px;color:var(--fg3);word-break:break-all;margin:1px 0 2px}
  .user .st{font-size:10.5px;color:var(--fg2);display:flex;gap:8px;flex-wrap:wrap}
  .user .st b{color:var(--wx);font-weight:600}
  .user .pv{font-size:10.5px;color:var(--fg3);white-space:nowrap;overflow:hidden;
            text-overflow:ellipsis;margin-top:2px}

  .head{background:var(--bg2);border:1px solid var(--line);border-radius:8px;
        padding:10px 14px;margin-bottom:14px}
  .head h2{margin:0 0 6px;font-size:14px}
  .head .kv{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--fg2)}
  .head .kv b{color:var(--fg)}

  .day{margin:16px 0 6px;font-size:11px;color:var(--fg3);
       border-bottom:1px dashed #232c3a;padding-bottom:3px}
  .day b{color:var(--fg2)}

  .m{display:flex;gap:10px;margin-bottom:9px}
  .m .t{flex:0 0 62px;color:var(--fg3);font-size:10.5px;padding-top:3px;text-align:right}
  .m .b{flex:1;min-width:0}
  .m.in .bubble{background:#16302a;border:1px solid #22553f;border-left:3px solid var(--wx);
                border-radius:0 8px 8px 0;padding:7px 11px;white-space:pre-wrap;
                word-break:break-word;font-size:13px}
  .m.out .bubble{background:#16283a;border:1px solid #1d3a5c;border-left:3px solid var(--bot);
                 border-radius:0 8px 8px 0;padding:7px 11px;white-space:pre-wrap;
                 word-break:break-word;font-size:12.5px;color:#bcd4ee}
  .m .lbl{font-size:10px;margin-bottom:3px}
  .m.in .lbl{color:var(--wx)}
  .m.out .lbl{color:var(--bot)}
  .empty{color:var(--fg3);padding:26px;text-align:center}
  .warn{color:var(--warn)}

  /* wxbot 通道 */
  .m.exp .bubble{background:#2a2412;border:1px solid #5c4a1d;border-left:3px solid #e0b341;
                 border-radius:0 8px 8px 0;padding:7px 11px;white-space:pre-wrap;
                 word-break:break-word;font-size:12.5px;color:#e8d9a8}
  .m.exp .lbl{color:#e0b341}
  .m.err .bubble{background:#2a1512;border:1px solid #5c2a1d;border-left:3px solid var(--warn);
                 border-radius:0 8px 8px 0;padding:6px 11px;color:#f0b9a8;font-size:11.5px}
  .m.err .lbl{color:var(--warn)}
  .m.sysline .bubble{background:transparent;border:none;color:var(--fg3);padding:0;
                     font-size:11px;white-space:pre-wrap}
  .m .meta{font-size:10px;color:var(--fg3);margin-top:4px;display:flex;gap:9px;
           flex-wrap:wrap;align-items:center}
  .m .meta .k{color:var(--fg2)}
  .slow{color:#ff5252;font-weight:700}
  .sbadge{font-size:9.5px;border-radius:4px;padding:0 5px;border:1px solid}
  .sb-ok{color:var(--wx);border-color:#22553f;background:#12281f}
  .sb-timeout,.sb-error{color:var(--warn);border-color:#5c2a1d;background:#2a1712}
  .sb-task{color:#e0b341;border-color:#5c4a1d;background:#2a2412}
  .sb-manual{color:var(--fg2);border-color:var(--line);background:#1a1f28}
  .sb-infer{color:var(--fg3);border-color:var(--line)}
  select#w-kind{padding:4px 6px}

  /* 定时任务卡片 */
  .jsec{margin-bottom:20px}
  .jsec h2{font-size:13px;margin:0 0 8px;padding:6px 10px;background:var(--bg2);
           border:1px solid var(--line);border-radius:7px;display:flex;gap:10px;
           align-items:center;flex-wrap:wrap}
  .jsec h2 .uid{font-size:10.5px;color:var(--fg3);font-weight:400}
  .jsec h2 .k{font-size:10.5px;color:var(--fg2);font-weight:400}
  .jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
  .jcard{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--fg3);
         border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
  .jcard.active{border-left-color:var(--ok)}
  .jcard.paused{border-left-color:var(--fg3)}
  .jcard.done{border-left-color:var(--asst)}
  .jcard.error{border-left-color:var(--warn)}
  .jcard .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .jcard .nm{font-size:12.5px;font-weight:600;color:var(--fg)}
  .jbadge{font-size:9.5px;border-radius:4px;padding:0 5px;border:1px solid}
  .jb-active{color:var(--ok);border-color:#22553f;background:#12281f}
  .jb-paused{color:var(--fg2);border-color:var(--line);background:#1a1f28}
  .jb-done{color:var(--asst);border-color:#1d3a5c;background:#12202f}
  .jb-error{color:var(--warn);border-color:#5c2a1d;background:#2a1712}
  .jcard .kv{font-size:11px;color:var(--fg2);display:grid;
             grid-template-columns:auto 1fr;gap:1px 8px;align-items:baseline}
  .jcard .kv .l{color:var(--fg3);white-space:nowrap}
  .jcard .kv .v{color:var(--fg);word-break:break-word}
  .jcard .kv .v.err{color:var(--warn)}
  .jcard .foot{font-size:10px;color:var(--fg3);display:flex;gap:10px;flex-wrap:wrap;
               border-top:1px solid #1c232e;padding-top:5px;margin-top:2px}
  .jcard details{font-size:11px}
  .jcard .pre{margin-top:4px;font-size:10.5px;max-height:200px}

  /* 用户分组 */
  .gcard{background:var(--bg2);border:1px solid var(--line);border-radius:8px;
         margin-bottom:12px;overflow:hidden}
  .gcard .gh{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;
             border-left:3px solid #3a4763;flex-wrap:wrap}
  .gcard .gh:hover{background:#19212c}
  .gcard.open .gh{border-left-color:var(--wx)}
  .gcaret{font-size:10px;color:var(--fg3);width:12px}
  .gcard .gt{font-size:13px;font-weight:600;color:var(--fg)}
  .gcard .gn{font-size:10.5px;color:var(--fg3)}
  .gcard .gc{font-size:10.5px;color:var(--fg2)}
  .gcard .gc b{color:var(--wx);font-weight:600}
  .gcard .gb{display:none;padding:6px 14px 12px;border-top:1px solid #1c232e}
  .gcard.open .gb{display:block}
  .gchip{display:inline-flex;align-items:center;gap:6px;margin:4px 6px 0 0;font-size:11.5px}
  .gchip .k2{color:var(--fg3);font-size:10px}
  .gchip .gx{border:none;background:transparent;color:var(--fg3);font-size:12px;
             padding:0 2px;cursor:pointer;font-family:inherit}
  .gchip .gx:hover{color:var(--warn)}
  .gadd{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .gadd select,.gadd input[type=text]{min-width:140px;max-width:230px}
  .gempty{color:var(--fg3);font-size:11.5px;padding:4px 0}
  .hbform{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:14px 16px;max-width:1000px}
  .hbform h2{font-size:14px;margin:0 0 8px}
  .hbrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}
  .hbrow label{color:var(--fg2)}
  .hbskills{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:7px;margin:10px 0 16px}
  .hbskill{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:7px 9px;display:flex;gap:8px;align-items:flex-start}
  .hbskill input{margin-top:4px;accent-color:var(--wx)}
  .hbskill .desc{font-size:10.5px;color:var(--fg3);line-height:1.45;margin-top:2px}
  .hbnote{font-size:11px;color:var(--fg2);padding:8px 10px;background:#121923;border-radius:6px;margin:10px 0}
  .hbstatus{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:14px;max-width:1000px}
  .hbstatus h2{font-size:13px;margin:0 0 8px;display:flex;gap:14px;flex-wrap:wrap}
  .hbstatus .summary{font-size:11px;color:var(--fg2);font-weight:400}
  .hbactions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .hbactions .hint{font-size:10.5px;color:var(--fg3)}
  .hbevent{border-top:1px solid #1c232e;padding:8px 2px;font-size:11px}
  .hbevent .evt{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
  .hbevent time,.hbevent .meta{color:var(--fg3)}
  .hbevent .detail{color:var(--fg2);white-space:pre-wrap;word-break:break-word;margin-top:3px}
  .hbevent pre{white-space:pre-wrap;word-break:break-word;background:#121923;border-radius:5px;padding:8px;margin:5px 0 0;color:var(--fg);font-family:inherit;font-size:11px;line-height:1.55}
  code{color:var(--fg2);background:#0b0e13;padding:1px 5px;border-radius:3px;font-size:11px}
  body{height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{flex:none}
  main{height:auto;flex:1;min-height:0}
  .monitor-note{color:var(--fg2);font-size:11px;margin:8px 0;white-space:pre-wrap;word-break:break-word}
  .monitor-source{color:var(--fg3);font-size:10.5px;word-break:break-all;margin-top:5px}
  .monitor-grid{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .monitor-grid .chip{border-radius:6px;padding:7px 12px}
  .queue-reason{padding:11px 14px;border:1px solid var(--line);border-left:3px solid var(--bot);border-radius:7px;background:var(--bg2);margin:10px 0}
  .queue-reason.error{border-left-color:var(--warn)}
  .queue-reason h3{font-size:12px;margin:0 0 5px}
  .monitor-table-wrap{overflow-x:auto;margin:8px 0 18px;border:1px solid var(--line);border-radius:7px}
  .monitor-table{border-collapse:collapse;width:100%;text-align:left;font-size:11px;background:var(--bg2)}
  .monitor-table th{padding:8px 10px;color:var(--fg2);font-weight:400;background:var(--bg3);white-space:nowrap}
  .monitor-table td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top;min-width:90px}
  .monitor-table td.preview{min-width:200px;max-width:650px;white-space:pre-wrap;word-break:break-word}
  .monitor-table code{word-break:break-all;font-size:10px}
  .monitor-table pre{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit;color:var(--fg)}
  .monitor-table .config-key{min-width:240px;max-width:420px;word-break:break-word}
  .monitor-section-title{font-size:13px;margin:20px 0 4px}
  .queue-commands{display:grid;gap:6px;margin-top:8px}
  .queue-commands code{display:block;padding:7px 9px;white-space:pre-wrap;word-break:break-all;user-select:all}
  .queue-actions{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
  .queue-actions .discard{color:var(--warn);border-color:var(--warn)}
  .flow-card{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--wx);border-radius:7px;margin:9px 0;padding:10px 13px}
  .flow-card.error{border-left-color:var(--warn)}
  .flow-card summary{cursor:pointer;word-break:break-word}
  .flow-card .flow-body{padding:8px 0 0}
  .flow-list{list-style:none;padding:0;margin:10px 0;border-left:1px solid var(--line)}
  .flow-list li{padding:5px 10px;margin-left:7px;border-bottom:1px solid #1c232e;font-size:11px;word-break:break-word}
  .flow-list time{color:var(--fg3);margin-right:9px}
  .flow-meta{color:var(--fg2);font-size:10.5px;margin:3px 0}
  @media(max-width:850px){ main{grid-template-columns:220px 1fr} section{padding:12px} }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#2b3646;border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>

<header>
  <div class="row">
    <h1>微信管家日志 <span style="color:var(--fg3);font-weight:400;font-size:11.5px">通道流水 · 收发队列 · 配置</span></h1>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="b-refresh">刷新</button>
    <button id="b-auto">自动刷新：关</button>
    <button id="j-showdone" class="hide">显示已完成</button>
    <button id="w-order">排序：倒序（新→旧）</button>
    <select id="w-kind">
      <option value="all">全部事件</option>
      <option value="flow">只看消息流转</option>
      <option value="chat">只看收发（收到/回复）</option>
      <option value="outbound">只看外发</option>
      <option value="slow">只看慢轮（&gt;300s）</option>
    </select>
    <select id="q-state" class="hide" aria-label="队列状态筛选">
      <option value="active">未完成任务</option><option value="all">全部状态</option>
      <option value="unbatched">待合并</option><option value="ready">待提交模型</option>
      <option value="processing">等待模型</option><option value="waiting_delivery">回复就绪</option>
      <option value="pending">待发送</option><option value="sending">键入中</option>
      <option value="confirming">发送确认中</option><option value="blocked">已阻断</option>
      <option value="uncertain">结果不确定</option><option value="done">整轮完成</option>
      <option value="sent">已发送</option><option value="skipped">已跳过</option>
    </select>
    <input id="c-search" class="hide" type="text" placeholder="搜索配置名称或值" aria-label="搜索配置">
    <span style="flex:1"></span>
  </div>
  <div class="tabs">
    <button id="tab-wxbot" class="on">wxbot 通道</button>
    <button id="tab-jobs">定时任务</button>
    <button id="tab-groups">用户分组</button>
    <button id="tab-heartbeat">心跳与角色</button>
    <button id="tab-queue">收发队列</button>
    <button id="tab-configuration">全部配置</button>
  </div>
</header>

<main>
  <aside id="list"></aside>
  <section id="pane"><div class="empty">左侧选一项查看详情</div></section>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2 = n => String(n).padStart(2,'0');
const d2 = t => { const d=new Date(t*1000); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; };
const hm = t => { const d=new Date(t*1000); return `${p2(d.getHours())}:${p2(d.getMinutes())}`; };
const full = t => { if(!t) return '-'; const d=new Date(t*1000);
  return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`; };
const ago = t => { if(!t) return '-'; const s=(Date.now()/1000)-t;
  if(s<60) return '刚刚'; if(s<3600) return Math.floor(s/60)+'分钟前';
  if(s<86400) return Math.floor(s/3600)+'小时前'; return Math.floor(s/86400)+'天前'; };

let state = { tab:'wxbot', jobUid:'all', jobShowDone:false, jobs:null, auto:0, timer:null,
              wdata:null, wUid:'all', wOrder:'desc', wKind:'all',wRequest:0,wFlowOffset:0,
              gdata:null, gUid:'all', gOpen:{}, gError:'',
              hdata:null, hstatus:null, hStatusError:'', hContact:'', hSkills:[], hSkillsContact:'', hRequest:0, hDraft:null, hError:'', hSaved:'',
              hTriggering:false, hTriggerMessage:'',
              qdata:null,qContact:'',qState:'active',qOffset:0,qRequest:0,qError:'',qBusy:false,qMessage:'',qActionFailed:false,
              cdata:null,cSection:'all',cSearch:'',cRequest:0,cError:'' };

async function get(u){ const r = await fetch(u); return r.json(); }

/* ---------------- wxbot 通道 ---------------- */
const hhmmss = s => (s||'').slice(11,19);
const daystr = s => (s||'').slice(0,10);
const sec1 = n => (n==null? '' : Number(n).toFixed(1));

async function loadWxbot(){
  const request=++state.wRequest;
  const params=new URLSearchParams({flow_contact:state.wUid==='all'?'':state.wUid,flow_offset:String(state.wFlowOffset)});
  try{
    const data = await get('/api/wxbot?'+params);
    if(request!==state.wRequest) return;
    state.wdata = data;
  }catch(e){
    if(state.tab!=='wxbot'||request!==state.wRequest) return;
    $('#pane').innerHTML = '<div class="empty">载入失败：'+esc(e.message||e)+'</div>';
    return;
  }
  if(state.tab!=='wxbot') return;
  renderWxNav();
  renderWxPane();
}

function renderWxNav(){
  const d = state.wdata, el = $('#list'), st = d.stats;
  const head = `<div class="user ${state.wUid==='all'?'sel':''}" data-u="all">
      <div class="nm">全部联系人</div>
      <div class="st"><span>事件 <b>${st.events}</b></span><span>收到 ${st.received}</span>
        <span>回复 ${st.reply}</span><span>外发 ${st.outbound}</span></div>
      <div class="st">${st.slow_rounds?`<span class="warn">慢轮(&gt;300s) ${st.slow_rounds}</span>`:''}
        ${st.timeouts?`<span class="warn">超时 ${st.timeouts}</span>`:''}
        <span>任务推断 ${st.inferred_tasks}</span></div>
    </div>`;
  el.innerHTML = head + d.contacts.map(c=>`
    <div class="user ${state.wUid===c.uid?'sel':''}" data-u="${esc(c.uid)}">
      <div class="nm">${esc(c.name)}${c.window?` <span class="sbadge ${c.window==='connected'?'sb-ok':'sb-timeout'}">${c.window==='connected'?'窗口在线':'窗口未开'}</span>`:''}</div>
      <div class="uid">${esc(c.user_id||c.uid)}${c.profile?` · ${esc(c.profile)}`:''}</div>
      <div class="st"><span>事件 <b>${c.count}</b></span><span>外发 ${c.out}</span>
        ${c.flow_count?`<span>流转 ${c.flow_count}</span>`:''}
        ${['blocked','uncertain'].includes(c.flow_reason)?'<span class="warn">队列阻塞</span>':''}
        ${c.slow?`<span class="warn">慢轮 ${c.slow}</span>`:''}</div>
    </div>`).join('');
  el.querySelectorAll('.user').forEach(n=>n.onclick=()=>{
    state.wUid = n.dataset.u; state.wFlowOffset=0;
    el.querySelectorAll('.user').forEach(x=>x.classList.toggle('sel', x.dataset.u===state.wUid));
    loadWxbot();
  });
}

function wxMeta(e){
  const bits = [];
  if(e.elapsed_s!=null){
    const sl = e.elapsed_s>300 && e.elapsed_kind!=='session';
    const lbl = e.elapsed_kind==='session' ? '会话累计耗时（非本轮）' : '调用 agent 耗时';
    bits.push(`<span>${lbl} <b class="${sl?'slow':''}">${sec1(e.elapsed_s)}s</b>${sl?' <span class="sbadge sb-error">慢</span>':''}</span>`);
  }
  if(e.reply_wait_s!=null) bits.push(`<span class="k">收到→回复 ${sec1(e.reply_wait_s)}s</span>`);
  if(e.status==='timeout') bits.push('<span class="sbadge sb-timeout">超时</span>');
  else if(e.status==='error') bits.push('<span class="sbadge sb-error">出错</span>');
  else if(e.status==='ok') bits.push('<span class="sbadge sb-ok">ok</span>');
  if(e.agent){
    bits.push(`<span class="k">session ${esc(e.agent.session_id)}</span>`);
    bits.push(`<span class="k">${e.agent.api_call_count} 次 API 调用</span>`);
    bits.push(`<span class="k">${e.agent.tool_call_count} 次工具调用</span>`);
  }
  return bits.join('');
}

function wxEvent(e){
  const t = `<div class="t">${hhmmss(e.time)}</div>`;
  if(e.direction==='system'){
    const txt = (e.content||'').trim();
    if(!txt) return '';
    return `<div class="m sysline">${t}<div class="b"><div class="bubble">· ${esc(txt)}</div></div></div>`;
  }
  if(e.direction==='api_error'){
    return `<div class="m err">${t}<div class="b">
      <div class="lbl">Hermes API 调用失败</div>
      <div class="bubble">${esc(e.content)}</div></div></div>`;
  }
  if(e.direction==='outbound'){
    const tk = e.task || {};
    const badge = tk.job_id
      ? `<span class="sbadge sb-task">任务 ${esc(tk.name)}</span><span class="sbadge sb-infer">推断</span><span class="k">job ${esc(tk.job_id)}</span>`
      : `<span class="sbadge sb-manual">${esc(tk.name||'管家 / 手动推送')}</span>`;
    const sent = e.sent_time ? `<span class="k">已发出 ${hhmmss(e.sent_time)}</span>` : '';
    return `<div class="m exp">${t}<div class="b">
      <div class="lbl">外发（wxbot 通道）</div>
      <div class="bubble">${esc(e.content)}</div>
      <div class="meta">${badge}${sent}</div></div></div>`;
  }
  const cls = e.direction==='received' ? 'in' : 'out';
  const lbl = e.direction==='received'
      ? `收到 · ${esc(e.name)} (${esc(e.uid)})` : '机器人回复';
  return `<div class="m ${cls}">${t}<div class="b">
    <div class="lbl">${lbl}</div>
    <div class="bubble">${esc(e.content)}</div>
    <div class="meta">${wxMeta(e)}</div></div></div>`;
}

const FLOW_STAGE_LABELS={wxbot_received:'wxbot 确认收件入库',wxbot_merge:'连续消息合并',
  wxbot_model:'模型工作线程领取',wxbot_butler:'wxbot 请求 Butler',butler_received:'Butler 确认收到',
  butler_session:'Butler 会话锁',hermes_request:'Butler 请求 Hermes',hermes_generating:'Hermes 生成回复',
  hermes_tool:'Hermes 工具执行',hermes_status:'Hermes 过程事件',hermes_approval:'Hermes 等待审批',
  hermes_result:'Hermes 完整结果',butler_action:'Butler 行动执行',butler_result:'Butler 结果就绪',
  wxbot_result:'wxbot 完整回复入发件箱',wechat_delivery:'微信分句发送'};
const FLOW_STATUS_LABELS={ok:'完成',started:'已开始，等待确认',accepted:'接口已接受',waiting:'等待中',
  running:'执行中',completed:'执行结束',failed:'失败',error:'失败',blocked:'已阻塞',uncertain:'结果不确定',
  unconfirmed:'未记录 / 未确认',not_started:'未提交',pending:'待发送',sending:'键入中',confirming:'发送确认中',sent:'已确认发送',skipped:'已跳过 / 丢弃'};
function renderMessageFlow(data){
  if(!data) return '';
  if(data.status!=='ok') return `<div class="head"><h2>消息流转记录</h2><div class="warn">${esc(data.error||'无法读取')}</div></div>`;
  let flows=(data.flows||[]).filter(f=>state.wUid==='all'||f.contact===state.wUid);
  if(state.wOrder==='asc') flows=flows.slice().reverse();
  const cards=flows.map((f,i)=>{
    const reason=f.reason||{},bad=['blocked','uncertain'].includes(reason.code)||['blocked','uncertain'].includes(f.state);
    const events=(f.events||[]).map(e=>{
      const failed=['error','failed','blocked','uncertain'].includes(e.status);
      const errorNote={missing_final_response:'缺少最终正文事件，请更新并重启 Hermes',invalid_stream:'Hermes 过程流无效或未完整结束'}[e.error_code];
      const bits=[e.tool&&('工具 '+e.tool),e.tool_call_id&&('调用 '+e.tool_call_id),
        e.http_status&&('HTTP '+e.http_status),e.elapsed_ms!=null&&('耗时 '+(e.elapsed_ms/1000).toFixed(2)+'s'),
        e.error_type&&('错误 '+e.error_type),errorNote,e.session_id&&('会话 '+e.session_id),
        e.part_seq&&('第 '+e.part_seq+'/'+e.part_count+' 句'),e.blocker_id&&('阻塞任务 '+e.blocker_id),
        e.delivery_id&&('发件 '+e.delivery_id),e.progress_available===false&&'接口未提供工具过程事件'].filter(Boolean);
      return `<li><time>${e.ts?esc(full(e.ts)):'—'}</time><b>${esc(FLOW_STAGE_LABELS[e.stage]||e.stage)}</b>
        <span class="sbadge ${failed?'sb-error':(e.status==='ok'||e.status==='sent'?'sb-ok':'sb-manual')}">${esc(FLOW_STATUS_LABELS[e.status]||e.status)}</span>
        ${bits.length?`<div class="flow-meta">${esc(bits.join(' · '))}</div>`:''}${e.detail?`<div class="monitor-note ${failed?'warn':''}">${esc(e.detail)}</div>`:''}</li>`;
    }).join('');
    return `<details class="flow-card ${bad?'error':''}" ${i===0?'open':''}><summary><b>${esc(f.contact)}</b> · ${esc(full(f.at))} · ${queueBadge(f.state)}<br>${esc(f.preview)}</summary>
      <div class="flow-body"><div class="flow-meta">${f.message_count} 条收件 · 收件序号 ${esc((f.inbox_ids||[]).join(', '))} · 请求 ID：<code>${esc(f.request_id||'尚未合并/提交')}</code></div>
      <div class="monitor-note ${bad?'warn':''}">${esc(reason.message||'')}${reason.record_id?' · 任务 '+esc(reason.record_id):''}${reason.error?'<br>'+esc(reason.error):''}</div>
      <ol class="flow-list">${events}</ol></div></details>`;
  }).join('');
  return `<div class="head"><h2>消息流转记录 · ${esc(state.wUid==='all'?'全部会话':state.wUid)}</h2>
    <div class="monitor-note">从 wxbot 收件入库开始显示。按用户和请求 ID 关联；未记录的阶段不会推断为成功。旧任务没有过程日志时显示“未确认”。</div>
    <div class="flow-meta">共 ${data.total||0} 轮 / 待合并消息 · 查询 ${esc(full(data.at))} · 每页 ${data.limit||50} 条</div>
    ${(data.sources||[]).map(s=>`<div class="monitor-source">${esc(s.path)} · ${esc(s.status)}${s.truncated?' · 仅读取最近 4MB':''}</div>`).join('')}</div>`+
    (cards||'<div class="monitor-note">当前没有消息流转记录</div>')+
    `<div class="row"><button id="w-flow-prev" ${data.offset>0?'':'disabled'}>上一页流转</button><span class="flow-meta">第 ${Math.floor((data.offset||0)/(data.limit||50))+1} 页</span><button id="w-flow-next" ${data.has_more?'':'disabled'}>下一页流转</button></div>`;
}

function renderWxPane(){
  const d = state.wdata;
  if(!d){ $('#pane').innerHTML='<div class="empty">载入中…</div>'; return; }
  let evs = d.events.filter(e=>state.wUid==='all' || e.uid===state.wUid);
  if(state.wKind==='chat') evs = evs.filter(e=>e.direction==='received'||e.direction==='reply');
  else if(state.wKind==='outbound') evs = evs.filter(e=>e.direction==='outbound');
  else if(state.wKind==='slow') evs = evs.filter(e=>e.elapsed_s!=null && e.elapsed_s>300);
  if(state.wOrder==='asc') evs = evs.slice().reverse();
  const st = d.stats;
  const head = `<div class="head">
    <h2>wxbot 通道 · 真实聊天窗口流水
      <span style="color:var(--fg3);font-weight:400;font-size:11px">${esc(d.log)}</span></h2>
    <div class="kv">
      <span>事件 <b>${st.events}</b></span>
      <span>收到 <b>${st.received}</b></span>
      <span>回复 <b>${st.reply}</b></span>
      <span>外发 <b>${st.outbound}</b></span>
      <span>超时 <b class="${st.timeouts?'slow':''}">${st.timeouts}</b></span>
      <span>慢轮(&gt;300s) <b class="${st.slow_rounds?'slow':''}">${st.slow_rounds}</b></span>
      <span>任务推断 <b>${st.inferred_tasks}</b></span>
      <span>会话 <b>${st.sessions}</b></span>
      <span style="flex:1"></span>
      <span class="k">生成 ${esc(d.generated_at)}</span>
    </div></div>`;
  const flowHtml=['all','chat','flow'].includes(state.wKind)?renderMessageFlow(d.flow):'';
  if(state.wKind==='flow') evs=[];
  let lastDay = null, html = '';
  for(const e of evs){
    const day = daystr(e.time);
    if(day!==lastDay){ html += `<div class="day"><b>${day}</b></div>`; lastDay = day; }
    html += wxEvent(e);
  }
  $('#pane').innerHTML = flowHtml + (state.wKind==='flow'?'':head+(html?`<details ${flowHtml?'':'open'}><summary>历史聊天流水（按时间关联）</summary>${html}</details>`:(!flowHtml?'<div class="empty">没有匹配的事件</div>':'')));
  if(flowHtml){
    const prev=$('#w-flow-prev'),next=$('#w-flow-next');
    if(prev) prev.onclick=()=>{state.wFlowOffset=Math.max(0,state.wFlowOffset-50);loadWxbot();};
    if(next) next.onclick=()=>{state.wFlowOffset+=50;loadWxbot();};
  }
}

const JSTATE = { active:['运行中','jb-active'], paused:['已暂停','jb-paused'],
                 done:['已完成','jb-done'], error:['出错','jb-error'] };
const JTYPE = { 1:'type=1 单发', 2:'type=2 群发' };
const JMT = { 1:'新闻消息', 2:'问候消息', 3:'其他' };
const JSRC = { profile:'按 Profile 归属', script:'按 script 配置', prompt:'按 prompt 归属',
               'script-target':'脚本内置目标', 'script-profile':'脚本内置 Profile' };
const parseTs = s => { if(!s) return null; const t = Date.parse(s); return isNaN(t) ? null : t/1000; };
const jUidText = u => u.uid==='global' ? '群发 · 收件人由字典决定' : (u.uid_display||u.uid);

function jobCard(j){
  const st = JSTATE[j.ui_state] || ['?','jb-paused'];
  const err = j.last_delivery_error || j.last_error || '';
  const nxt = parseTs(j.next_run_at), lst = parseTs(j.last_run_at);
  const rows = [
    ['计划', esc(j.schedule||'-')],
    ['下次跑', nxt ? full(nxt) : '-'],
    ['上次跑', (lst ? full(lst) : '-') + (j.last_status ? ` · ${esc(j.last_status)}` : '')],
    ['投递到', esc(j.deliver||'-') + (JSRC[j.uid_source] ? ` <span style="color:var(--fg3)">（${esc(JSRC[j.uid_source])}）</span>` : '')],
    ['类型', (j.script ? 'script '+esc(j.script) : (j.no_agent ? 'no_agent' : 'agent'))
             + (j.repeat ? ` · ${esc(j.repeat)}` : '')],
  ];
  if(j.push_type || j.message_type){
    const bits = [];
    if(j.push_type) bits.push(JTYPE[j.push_type] || `type=${j.push_type}`);
    if(j.message_type) bits.push(`messageType=${j.message_type}（${JMT[j.message_type]||'?'}）`);
    if(j.scope==='global') bits.push('收件人按「用户分组」字典');
    rows.push(['推送', esc(bits.join(' · '))]);
  }
  if(err) rows.push(['错误', `<span class="err">${esc(err)}</span>`]);
  return `<div class="jcard ${j.ui_state}">
    <div class="t"><span class="nm">${esc(j.name)}</span><span class="jbadge ${st[1]}">${st[0]}</span></div>
    <div class="kv">${rows.map(r=>`<span class="l">${r[0]}</span><span class="v">${r[1]}</span>`).join('')}</div>
    ${j.prompt ? `<details><summary>prompt 摘要</summary><div class="pre">${esc(j.prompt)}</div></details>` : ''}
    <div class="foot"><span>job ${esc(j.job_id)}</span><span>profile ${esc(j.profile)}</span></div>
  </div>`;
}

const jVisible = j => state.jobShowDone || j.ui_state !== 'done';   // 默认隐藏已完成
const jStats = jobs => ({
  count: jobs.length,
  active: jobs.filter(j=>j.ui_state==='active').length,
  paused: jobs.filter(j=>j.ui_state==='paused').length,
  error:  jobs.filter(j=>j.ui_state==='error').length,
  done:   jobs.filter(j=>j.ui_state==='done').length,
});

function renderJobsNav(){
  const d = state.jobs, el = $('#list');

  const head = `<div class="user ${state.jobUid==='all'?'sel':''}" data-u="all">
      <div class="nm">全部归属</div>

        <span>暂停 ${all.paused}</span>${all.done?`<span>已完成 ${all.done}</span>`:''}

        ${all.error?`<span class="warn">出错 ${all.error}</span>`:''}</div>
    </div>`;
  el.innerHTML = head + d.users.map(u=>{
    const st = jStats(u.jobs.filter(jVisible));

function renderJobs(){
  const d = state.jobs;
  if(!d){ $('#pane').innerHTML='<div class="empty">载入中…</div>'; return; }
  const secs = state.jobUid==='all' ? d.users : d.users.filter(u=>u.uid===state.jobUid);
  if(!secs.length){ $('#pane').innerHTML='<div class="empty">没有定时任务</div>'; return; }
  const hiddenIn = secs.reduce((a,u)=>a+u.jobs.filter(j=>!jVisible(j)).length, 0);
  if(secs.every(u=>!u.jobs.some(jVisible))){
    $('#pane').innerHTML = `<div class="empty">没有可显示的任务${
      hiddenIn?` —— ${hiddenIn} 个已完成已隐藏（点上方「显示已完成」查看）`:''}</div>`;
    return;

  $('#pane').innerHTML = secs.map(u=>{

  }).join('');
}

    if(!name){ state.gError = '请先选择或输入要绑定的用户'; renderGroupsPane(); return; }
    gMutate('bind', t, name);
  });
}

async function gMutate(action, type, user){
  state.gError = '';
  try{
    const res = await postJSON('/api/groups', {action, type: Number(type), user});
    if(res && res.message_types){ state.gdata = res; }
    else { state.gError = '操作失败：'+((res && (res.error||res.detail)) || '未知原因'); }
  }catch(e){ state.gError = '操作失败：'+(e.message||e); }
  renderGroupsNav();
  renderGroupsPane();
}

/* ---------------- 心跳与角色 skill ---------------- */
async function apiGet(u){
  const r = await fetch(u), data = await r.json();
  if(!r.ok) throw new Error((data && (data.detail||data.error)) || `HTTP ${r.status}`);
  return data;
}

async function loadHeartbeat(){
  state.hError = '';
  try{
    state.hdata = await apiGet('/api/heartbeat-config');
    try{
      state.hstatus = await apiGet('/api/heartbeat-status?limit=30');
      state.hStatusError = '';
    }catch(e){ state.hstatus = null; state.hStatusError = e.message||String(e); }
    const contacts = state.hdata.contacts || [];
    if(!contacts.some(c=>c.name===state.hContact)) state.hContact = contacts[0]?.name || '';
    if(state.hContact) await loadHeartbeatSkills(state.hContact);
    else if(!state.hContact){ state.hSkills=[]; state.hDraft=null; }
  }catch(e){ state.hError = '载入失败：'+(e.message||e); }
  if(state.tab!=='heartbeat') return;
  renderHeartbeatNav();
  renderHeartbeatPane();
}

function isRoleSkill(skill){
  return (Array.isArray(skill.tags) ? skill.tags : [])
    .some(tag=>String(tag).trim().toLowerCase()==='butler-role');
}

async function loadHeartbeatSkills(contact){
  const requestId=++state.hRequest;
  state.hContact = contact;
  state.hSkillsContact = contact;
  state.hSkills = [];
  state.hError = '';
  state.hSaved = '';
  try{
    const data = await apiGet('/api/skills?contact='+encodeURIComponent(contact));
    if(requestId!==state.hRequest) return;
    state.hSkills = data.skills || [];
    const saved = (state.hdata && state.hdata.policies && state.hdata.policies[contact]) || {};
    const roleOptions = new Set(state.hSkills.filter(isRoleSkill).map(s=>s.name));
    const toolOptions = new Set(state.hSkills.filter(s=>!isRoleSkill(s)).map(s=>s.name));
    const savedRole = saved.role_skill || '';
    const role = roleOptions.has(savedRole) ? savedRole : '';
    const allowed = Array.isArray(saved.allowed_skills)
      ? [...new Set(saved.allowed_skills.filter(name=>toolOptions.has(name)))] : [];
    state.hDraft = {role_skill:role, allowed_skills:allowed,
                    heartbeat_enabled:saved.heartbeat_enabled===true};
    if(savedRole && !role) state.hError='已保存的角色 skill 未标记 butler-role，请重新选择角色 skill。';
  }catch(e){ if(requestId!==state.hRequest) return; state.hError = '技能目录载入失败：'+(e.message||e); }
  renderHeartbeatNav();
  renderHeartbeatPane();
}

function renderHeartbeatNav(){
  if(state.tab!=='heartbeat') return;
  const el = $('#list'), contacts = (state.hdata && state.hdata.contacts) || [];
  el.innerHTML = contacts.length ? contacts.map(c=>{
    const p = (state.hdata.policies||{})[c.name] || {};
    return `<div class="user ${state.hContact===c.name?'sel':''}" data-hcontact="${esc(c.name)}">
      <div class="nm">${esc(c.label||c.name)} ${p.heartbeat_enabled?'<span class="tag">心跳开</span>':''}</div>
      <div class="uid">${esc(c.name)} · ${esc(c.profile)}</div>
      <div class="pv">${p.role_skill?'角色：'+esc(p.role_skill):'尚未绑定角色 skill'}</div>
    </div>`;
  }).join('') : '<div class="empty">Butler 配置中没有可管理的私聊联系人</div>';
  el.querySelectorAll('[data-hcontact]').forEach(n=>n.onclick=()=>loadHeartbeatSkills(n.dataset.hcontact));
}

function heartbeatDate(value){
  if(!value) return '-';
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? String(value) : full(date.getTime()/1000);
}

function heartbeatEventTitle(event){
  const labels={scheduler_started:'Butler 心跳调度启动',scheduled:'下次心跳已安排',
    trigger_started:'心跳开始执行',trigger_skipped:'本轮跳过',contact_selected:'选中联系人',
    hermes_call_started:'开始调用 Hermes',hermes_result:'Hermes 返回结果',
    push_succeeded:'建议已发送',push_failed:'建议发送失败',error:'执行错误',
    scheduler_not_started:'调度未启动',scheduler_stopping:'调度正在停止',scheduler_stopped:'调度已停止',
    manual_trigger_requested:'收到手动触发请求',manual_trigger_accepted:'Butler 已接受手动触发',
    manual_trigger_rejected:'手动触发未执行'};
  if(event.event==='hermes_result') return event.result==='none'?'Hermes 检查完成：没有建议':
    (event.result==='suggestion'?'Hermes 返回了建议':(event.result==='invalid'?'Hermes 返回格式无效':'Hermes 返回'));
  if(event.event==='error') return '执行错误（'+(event.phase||'未知阶段')+'）';
  return labels[event.event]||event.event||'心跳事件';
}

function renderHeartbeatStatus(){
  const status=state.hstatus;
  if(!status) return `<div class="hbstatus"><h2>心跳运行记录</h2><div class="warn">读取运行记录失败：${esc(state.hStatusError||'未知错误')}</div></div>`;
  const events=Array.isArray(status.events)?status.events:[];
  const due=Number(status.next_run_at);
  const next=Number.isFinite(due)&&due>0?full(due):'尚未安排';
  const rows=events.map(event=>{
    const meta=[event.source&&('来源：'+(event.source==='manual'?'手动':'定时')),
      event.contact&&('用户：'+event.contact),event.role_skill&&('角色：'+event.role_skill),
      event.elapsed_ms!=null&&('耗时：'+event.elapsed_ms+' ms'),
      Array.isArray(event.allowed_skills)&&event.allowed_skills.length&&('允许技能：'+event.allowed_skills.join('、'))]
      .filter(Boolean).join(' · ');
    const detail=event.text||event.detail||(event.next_run_at?'下次触发：'+full(Number(event.next_run_at)):
      ({no_enabled_contacts:'没有已开启心跳的联系人',contact_not_configured:'联系人未配置',
        policy_missing:'联系人尚未保存角色和 Skill 配置',policy_unavailable:'角色和 Skill 配置不可读取',
        busy:'已有一轮心跳正在执行',start_failed:'无法启动执行'}[event.reason]||''));
    return `<div class="hbevent"><div class="evt"><b>${esc(heartbeatEventTitle(event))}</b><time>${esc(heartbeatDate(event.at))}</time></div>
      ${meta?`<div class="meta">${esc(meta)}</div>`:''}${detail?`<div class="detail">${esc(detail)}</div>`:''}</div>`;
  }).join('');
  const errors=[status.state_error&&'调度状态读取失败（'+status.state_error+'）',
    status.audit_error&&'审计文件读取失败（'+status.audit_error+'）'].filter(Boolean);
  return `<div class="hbstatus"><h2>心跳运行记录 <span class="summary">已开启 ${esc(status.enabled_contacts||0)} 位 · 下次计划：${esc(next)}</span></h2>
    ${errors.length?`<div class="warn">${esc(errors.join('；'))}</div>`:''}
    ${rows||'<div class="empty">暂无心跳事件记录；Butler 调度启动或下一轮触发后会显示过程。</div>'}</div>`;
}

function renderHeartbeatPane(){
  if(state.tab!=='heartbeat') return;
  const d = state.hdata, contact = d && (d.contacts||[]).find(c=>c.name===state.hContact);
  if(!d){ $('#pane').innerHTML = `<div class="empty">${esc(state.hError||'正在载入心跳配置…')}</div>`; return; }
  if(!contact){ $('#pane').innerHTML = `<div class="empty">${esc(state.hError||'请选择一个私聊联系人')}</div>`; return; }
  if(!state.hDraft){ $('#pane').innerHTML = `<div class="empty">${esc(state.hError||'正在载入角色 skill…')}</div>`; return; }
  const draft = state.hDraft, skills = state.hSkills;
  const roleSkills = skills.filter(isRoleSkill);
  const toolSkills = skills.filter(s=>!isRoleSkill(s));
  const roleOptions = roleSkills.map(s=>`<option value="${esc(s.name)}" ${draft.role_skill===s.name?'selected':''}>${esc(s.name)}${s.category?' · '+esc(s.category):''}</option>`).join('');
  const selected = new Set(draft.allowed_skills||[]);
  const boxes = toolSkills.map(s=>{
    const checked = selected.has(s.name);
    return `<label class="hbskill"><input type="checkbox" data-hskill="${esc(s.name)}" ${checked?'checked':''}>
      <span><b>${esc(s.name)}</b>
        <div class="desc">${esc(s.description||s.category||'')}</div></span></label>`;
  }).join('');
  const interval = d.interval_minutes || {min:180,max:360};
  const savedPolicy = (d.policies||{})[contact.name] || {};
  $('#pane').innerHTML = `<div class="head"><h2>用户角色与心跳 · ${esc(contact.label||contact.name)}</h2>
    <div class="kv"><span>微信窗口 <b>${esc(contact.name)}</b></span><span>Hermes Profile <b>${esc(contact.profile)}</b></span>
      <span>心跳间隔 <b>${esc(interval.min)}–${esc(interval.max)} 分钟随机</b></span></div>
    <div class="hbactions"><button id="hb-trigger" class="wx" ${savedPolicy.role_skill&&!state.hTriggering?'':'disabled'}>${state.hTriggering?'提交中…':'立即触发此用户'}</button>
      <span class="hint">手动触发不受自动心跳开关限制，需先保存角色 Skill 配置。</span></div>
    ${state.hTriggerMessage?`<div class="hbnote">${esc(state.hTriggerMessage)}</div>`:''}</div>
    ${renderHeartbeatStatus()}
    <div class="hbform">
      <div class="hbnote">普通私聊会使用下方角色和技能白名单，保存后下一条消息生效。心跳开启后，Butler 每次随机选择一名已开启用户，Hermes 只返回建议，由 Butler 私聊发送。</div>
      <div class="hbrow"><label><input id="hb-enabled" type="checkbox" ${draft.heartbeat_enabled?'checked':''}> 为此用户开启心跳</label></div>
      <div class="hbrow"><label for="hb-role">角色 skill</label>
        <select id="hb-role"><option value="">请选择角色 skill</option>${roleOptions}</select>
        <span class="chip">角色 skill 会由 Hermes 单独加入运行时白名单</span></div>
      <h2>允许调用的工具 skills</h2>
      ${toolSkills.length?`<div class="hbskills">${boxes}</div>`:'<div class="empty">Hermes 没有返回可用的工具 skills</div>'}
      ${state.hError?`<div class="warn">${esc(state.hError)}</div>`:''}
      ${state.hSaved?`<div style="color:var(--ok);margin:8px 0">${esc(state.hSaved)}</div>`:''}
      <button id="hb-save" class="wx" ${skills.length?'':'disabled'}>保存配置</button>
    </div>`;
  $('#hb-enabled').onchange = e=>{ draft.heartbeat_enabled=e.target.checked; };
  $('#hb-role').onchange = e=>{
    draft.role_skill=e.target.value;
    draft.allowed_skills=draft.allowed_skills.filter(name=>name!==draft.role_skill);
    state.hSaved=''; renderHeartbeatPane();
  };
  $('#pane').querySelectorAll('[data-hskill]').forEach(box=>box.onchange=e=>{
    const name=e.target.dataset.hskill;
    const allowed=new Set(draft.allowed_skills);
    if(e.target.checked) allowed.add(name); else allowed.delete(name);
    draft.allowed_skills=[...allowed]; state.hSaved='';
  });
  $('#hb-save').onclick=saveHeartbeatPolicy;
  $('#hb-trigger').onclick=triggerHeartbeat;
}

async function triggerHeartbeat(){
  if(state.hTriggering||!state.hContact) return;
  state.hTriggering=true;
  state.hTriggerMessage='正在向 Butler 提交手动心跳…';
  renderHeartbeatPane();
  try{
    const result=await postJSON('/api/heartbeat-trigger',{contact:state.hContact});
    if(!result||!result.ok) throw new Error((result&&(result.error||result.detail))||'提交失败');
    state.hTriggerMessage='Butler 已接受请求；执行过程和建议会写入上方记录。';
    await new Promise(resolve=>setTimeout(resolve,400));
    try{
      state.hstatus=await apiGet('/api/heartbeat-status?limit=30');
      state.hStatusError='';
    }catch(e){ state.hStatusError=e.message||String(e); }
  }catch(e){ state.hTriggerMessage='触发失败：'+(e.message||e); }
  finally{
    state.hTriggering=false;
    renderHeartbeatPane();
  }
}

async function saveHeartbeatPolicy(){
  const draft=state.hDraft;
  state.hError=''; state.hSaved='';
  if(!draft.role_skill){ state.hError='请先选择角色 skill'; renderHeartbeatPane(); return; }
  try{
    const result=await postJSON('/api/heartbeat-config', {contact:state.hContact,
      role_skill:draft.role_skill, allowed_skills:draft.allowed_skills,
      heartbeat_enabled:draft.heartbeat_enabled});
    if(!result || !result.ok) throw new Error((result && (result.error||result.detail)) || '保存失败');
    state.hdata.policies[state.hContact]=result.policy;
    state.hSaved='已保存；普通消息与下一次心跳会读取此配置。';
  }catch(e){ state.hError='保存失败：'+(e.message||e); }
  renderHeartbeatNav(); renderHeartbeatPane();
}

/* ---------------- 收发队列 / 配置总览 ---------------- */
const QUEUE_LABELS={unbatched:'待合并',ready:'待提交模型',processing:'等待模型',waiting_delivery:'回复就绪',
  pending:'待发送',sending:'键入中',confirming:'发送确认中',blocked:'已阻断',uncertain:'结果不确定',
  sent:'已发送',skipped:'已跳过',timeout_discard:'超时丢弃',done:'整轮完成',idle:'空闲',pending_capture:'待采集',merging:'合并中',ready_to_merge:'待调度',state_mismatch:'状态待核对'};
const ORIGIN_LABELS={file:'文件值',default:'默认值',code:'固定规则',runtime:'运行参数'};
function queueBadge(status){
  const cls=['blocked','uncertain'].includes(status)?'sb-error':(['done','sent','skipped'].includes(status)?'sb-ok':'sb-manual');
  return `<span class="sbadge ${cls}">${esc(QUEUE_LABELS[status]||status)}</span>`;
}
async function loadQueue(){
  if(state.qBusy) return;
  const request=++state.qRequest;
  const qs=new URLSearchParams({contact:state.qContact,state:state.qState,offset:String(state.qOffset),limit:'50'});
  try{
    const data=await apiGet('/api/queue?'+qs);
    if(request!==state.qRequest||state.tab!=='queue') return;
    state.qdata=data; state.qError='';
  }catch(e){
    if(request!==state.qRequest||state.tab!=='queue') return;
    state.qdata=null; state.qError=e.message||'队列载入失败';
  }
  renderQueueNav(); renderQueuePane();
}
function renderQueueNav(){
  const contacts=state.qdata?.contacts||[];
  $('#list').innerHTML=`<div class="user ${!state.qContact?'sel':''}" data-qindex="-1"><div class="nm">全部会话</div><div class="st">查看所有用户和群聊的队列</div></div>`+
    contacts.map((c,i)=>`<div class="user ${state.qContact===c.contact?'sel':''}" data-qindex="${i}">
      <div class="nm">${esc(c.contact)} ${queueBadge(c.reason.code)}</div>
      <div class="st">待合并 <b>${c.unbatched}</b> · 待发 <b>${Object.entries(c.outbox).filter(([s])=>!['sent','skipped'].includes(s)).reduce((n,[s,v])=>n+v,0)}</b></div>
      <div class="pv">${esc(c.reason.message)}</div></div>`).join('');
  $('#list').querySelectorAll('[data-qindex]').forEach(el=>el.onclick=()=>{
    const i=Number(el.dataset.qindex); state.qContact=i<0?'':contacts[i].contact; state.qOffset=0; loadQueue();
  });
}
const QUEUE_ACTION_LABELS={retry:'重试',sent:'确认已发',skip:'立即丢弃'};
function queueActionButtons(r,kind,records){
  if(!state.qdata?.actions_enabled || !r.actions?.length) return '';
  const index=records.push({id:r.id||r.record_id,kind,contact:r.contact,
    expected_state:r.state,expected_finished_at:r.finished_at??null,
    ...(kind==='batches'?{expected_attempts:r.attempts}:{})})-1;
  return `<div class="queue-actions">${r.actions.map(action=>`<button class="${action==='skip'?'discard':''}" data-q-action="${action}" data-q-record="${index}" ${state.qBusy?'disabled':''}>${QUEUE_ACTION_LABELS[action]||''}</button>`).join('')}</div>`;
}
function queueCountdown(at){
  if(at==null) return '';
  const left=Math.max(0,Math.ceil(at-Date.now()/1000));
  return `<div class="monitor-note warn" data-discard-at="${Number(at)}">${left?'剩余 '+left+' 秒自动丢弃':'已到丢弃时间，等待 wxbot 巡检'}</div>`;
}
function updateQueueCountdowns(){
  if(state.tab!=='queue') return;
  $('#pane').querySelectorAll('[data-discard-at]').forEach(el=>{
    const left=Math.max(0,Math.ceil(Number(el.dataset.discardAt)-Date.now()/1000));
    el.textContent=left?'剩余 '+left+' 秒自动丢弃':'已到丢弃时间，等待 wxbot 巡检';
  });
}
setInterval(updateQueueCountdowns,1000);
async function performQueueAction(record,action){
  if(state.qBusy || !record || !QUEUE_ACTION_LABELS[action]) return;
  const caution=action==='retry'?(record.kind==='outbox'?
    '请先核对微信实际发送结果，并清理残留草稿。重试可能重复发送，首次失败的3分钟倒计时不会重置。':
    '请先核对模型与工具实际执行结果。重试可能重复执行工具。'):
    action==='sent'?'请确认已在微信看到这条消息实际发送成功。此操作只登记结果，不再发送。':
    '此操作放弃这条任务并释放后续队列，保留消息和失败记录。';
  if(!confirm(`${QUEUE_ACTION_LABELS[action]} · ${record.contact}\n任务 ${record.id}\n\n${caution}`)) return;
  state.qBusy=true;state.qMessage='正在处理…';state.qActionFailed=false;
  if(state.tab==='queue')renderQueuePane();
  try{
    const response=await fetch('/api/queue-action',{method:'POST',
      headers:{'Content-Type':'application/json','X-Wxbot-Queue-Action':'1'},
      body:JSON.stringify({...record,action,acknowledge:true})});
    const data=await response.json();
    if(!response.ok||!data.ok)throw new Error(data.error||'操作失败');
    state.qMessage=`${record.contact} · ${record.id}：${QUEUE_ACTION_LABELS[action]}已登记`;
  }catch(error){state.qActionFailed=true;state.qMessage=error.message||'操作失败';}
  finally{state.qBusy=false;}
  if(state.tab==='queue')await loadQueue();
}
function queueReason(c,records){
  const r=c.reason, bad=['blocked','uncertain'].includes(r.code);
  const labels={sent:'已核对实际发送成功',retry:'确需重试（可能重复操作）',skip:'放弃此异常任务'};
  return `<div class="queue-reason ${bad?'error':''}"><h3>${esc(c.contact)} · ${queueBadge(r.code)}</h3>
    <div>${esc(r.message)}${r.wait_seconds>0?' · 约 '+Math.ceil(r.wait_seconds)+' 秒':''}</div>
    ${r.record_id?`<div class="monitor-source">${r.record_kind==='outbox'?'发件 ID':'批次 ID'}：<code>${esc(r.record_id)}</code></div>`:''}

    ${queueActionButtons({...r,contact:c.contact},r.record_kind,records)}
    ${r.commands?`<details><summary>查看对应恢复命令</summary><div class="monitor-note">先核对微信、草稿和实际发送结果；也可使用上方人工核对按钮。以下命令请在项目目录的 PowerShell 中使用，不会自动执行。</div>
      <div class="queue-commands">${Object.entries(r.commands).map(([kind,cmd])=>`<div>${esc(labels[kind]||kind)}<code>${esc(cmd)}</code></div>`).join('')}</div></details>`:''}</div>`;
}
function queueTable(title,rows,kind,page,records){
  return `<h3 class="monitor-section-title">${title} <span class="monitor-source">${page?.total||0} 条，当前显示 ${rows.length} 条</span></h3>`+

}
function queueEventTable(events){
  const labels={failed:'发送失败',timeout_discard:'满3分钟自动丢弃',retry:'人工重试',confirm_sent:'人工确认已发',manual_discard:'人工丢弃'};
  return '<h3 class="monitor-section-title">发送失败与人工核对记录 · 最近50条</h3>'+(events.length?
    `<div class="monitor-table-wrap"><table class="monitor-table"><thead><tr><th>时间 / 会话</th><th>处理记录</th><th>任务</th></tr></thead><tbody>${events.map(e=>
      `<tr><td>${esc(full(e.at))}<br>${esc(e.contact)}</td><td><b>${esc(labels[e.action]||e.action)}</b><div class="monitor-note">${esc(e.reason)}</div>
      ${Object.keys(e.details||{}).length?`<details><summary>失败现场信息</summary><pre>${esc(JSON.stringify(e.details,null,2))}</pre></details>`:''}</td>
      <td><code>${esc(e.record_id)}</code><div class="monitor-source">来源 ${esc(e.source)}</div></td></tr>`).join('')}</tbody></table></div>`:
    '<div class="monitor-note">暂无失败或人工处理记录</div>');
}
function renderQueuePane(){
  const d=state.qdata;
  if(!d){ $('#pane').innerHTML=`<div class="empty warn">${esc(state.qError||'正在载入队列…')}</div>`; return; }
  if(d.status!=='ok'){ $('#pane').innerHTML=`<div class="head"><h2>收发队列</h2><div class="warn">${esc(d.error)}</div><div class="monitor-source">${esc(d.database)}</div></div>`; return; }
  const total=(which,status)=>d.counts[which]?.[status]||0;
  const contacts=(d.contacts||[]).filter(c=>state.qContact?c.contact===state.qContact:c.reason.code!=='idle');
  const more=Object.values(d.pages||{}).some(p=>p.has_more);
  const records=[];
  $('#pane').innerHTML=`<div class="head"><h2>收发队列 · ${esc(state.qContact||'全部会话')}</h2>
    <div class="monitor-grid"><span class="chip">全队列待合并 <b>${d.counts.unbatched||0}</b></span><span class="chip">待提交 <b>${total('batches','ready')}</b></span>
    <span class="chip">等待模型 <b>${total('batches','processing')}</b></span><span class="chip">待发句子 <b>${total('outbox','pending')}</b></span>
    <span class="chip">异常句子 <b class="warn">${total('outbox','blocked')+total('outbox','uncertain')}</b></span></div>
    <div class="monitor-note">同一会话按顺序处理。发件失败从首次失败起最多等待3分钟，超时自动丢弃该句并保留日志。人工核对按钮在下方异常任务旁，操作前需要确认。模型结果不确定时仍需人工核对。</div>
    ${!d.actions_enabled?'<div class="monitor-note warn">请先重启更新后的 wxbot 完成队列升级，启用3分钟规则和人工核对按钮。</div>':''}
    ${state.qMessage?`<div class="monitor-note ${state.qActionFailed?'warn':''}">${esc(state.qMessage)}</div>`:''}
    <div class="monitor-source">数据库：${esc(d.database)} · 查询时间：${esc(full(d.at))}</div></div>`+
    (contacts.length?contacts.map(c=>queueReason(c,records)).join(''):'<div class="monitor-note">没有待处理任务</div>')+
    queueTable('待合并消息',d.inbox||[],'inbox',d.pages.inbox,records)+queueTable('模型批次',d.batches||[],'batches',d.pages.batches,records)+
    queueTable('回复分句 / 主动推送',d.outbox||[],'outbox',d.pages.outbox,records)+queueEventTable(d.events||[])+
    `<div class="row"><button id="q-prev" ${state.qOffset===0?'disabled':''}>上一页</button><span class="monitor-note">第 ${Math.floor(state.qOffset/50)+1} 页，每类最多 50 条</span><button id="q-next" ${more?'':'disabled'}>下一页</button></div>`;
  $('#q-prev').onclick=()=>{state.qOffset=Math.max(0,state.qOffset-50);loadQueue();};
  $('#q-next').onclick=()=>{state.qOffset+=50;loadQueue();};
  $('#pane').querySelectorAll('[data-q-action]').forEach(button=>button.onclick=()=>
    performQueueAction(records[Number(button.dataset.qRecord)],button.dataset.qAction));
}
async function loadConfiguration(){
  const request=++state.cRequest;
  try{
    const data=await apiGet('/api/configuration');
    if(request!==state.cRequest||state.tab!=='configuration') return;
    state.cdata=data;state.cError='';
  }catch(e){
    if(request!==state.cRequest||state.tab!=='configuration') return;
    state.cdata=null;state.cError=e.message||'配置载入失败';
  }
  renderConfigurationNav();renderConfigurationPane();
}
function configurationMatches(section,row){
  const q=state.cSearch.trim().toLowerCase();
  return !q||(section.title+' '+row.key+' '+JSON.stringify(row.value)).toLowerCase().includes(q);
}
function renderConfigurationNav(){
  const sections=state.cdata?.sections||[];
  $('#list').innerHTML=`<div class="user ${state.cSection==='all'?'sel':''}" data-cindex="-1"><div class="nm">全部配置</div><div class="st">文件值 / 默认值 / 固定规则</div></div>`+
    sections.map((s,i)=>`<div class="user ${state.cSection===s.id?'sel':''}" data-cindex="${i}"><div class="nm">${esc(s.title)}</div><div class="st">${s.rows.filter(r=>configurationMatches(s,r)).length} 项</div></div>`).join('');
  $('#list').querySelectorAll('[data-cindex]').forEach(el=>el.onclick=()=>{
    const i=Number(el.dataset.cindex);state.cSection=i<0?'all':sections[i].id;renderConfigurationNav();renderConfigurationPane();
  });
}
function renderConfigurationPane(){
  const d=state.cdata;
  if(!d){ $('#pane').innerHTML=`<div class="empty warn">${esc(state.cError||'正在载入配置…')}</div>`; return; }
  const sections=d.sections.filter(s=>state.cSection==='all'||s.id===state.cSection);
  $('#pane').innerHTML=`<div class="head"><h2>全部配置 · 只读</h2><div class="monitor-note">${esc(d.note)}</div>
    <div class="monitor-note">密钥由服务端隐藏，浏览器不会收到密钥原值。角色、Skill 和心跳开关仍可在「心跳与角色」页维护。</div>
    ${(d.warnings||[]).map(w=>`<div class="monitor-note warn">${esc(w)}</div>`).join('')}
    ${d.sources.map(s=>`<div class="monitor-source ${s.status==='ok'?'':'warn'}">${esc(s.title)} · ${esc(s.path)} · ${s.status==='ok'?'修改于 '+esc(full(s.modified_at)):esc(s.error)}</div>`).join('')}</div>`+
    sections.map(s=>{
      const rows=s.rows.filter(r=>configurationMatches(s,r));
      if(!rows.length) return '';
      return `<h3 class="monitor-section-title">${esc(s.title)}</h3><div class="monitor-source">来源：${esc(s.source)}</div><div class="monitor-table-wrap"><table class="monitor-table"><thead><tr><th>配置名称</th><th>值</th><th>取值来源</th></tr></thead><tbody>`+
        rows.map(r=>`<tr><td class="config-key"><code>${esc(r.key)}</code></td><td class="preview"><pre>${esc(typeof r.value==='string'?(r.value||'（空）'):JSON.stringify(r.value,null,2))}</pre></td><td>${esc(ORIGIN_LABELS[r.origin]||r.origin)}${r.sensitive?'<div class="monitor-source">密钥已隐藏</div>':''}</td></tr>`).join('')+'</tbody></table></div>';
    }).join('');
  if(!sections.some(s=>s.rows.some(r=>configurationMatches(s,r)))){
    $('#pane').innerHTML+='<div class="empty">当前分类没有匹配配置，可清空搜索或选择左侧「全部配置」。</div>';
  }
}

function switchTab(t){
  state.tab = t;
  $('#tab-wxbot').classList.toggle('on', t==='wxbot');
  $('#tab-jobs').classList.toggle('on', t==='jobs');
  $('#tab-groups').classList.toggle('on', t==='groups');
  $('#tab-heartbeat').classList.toggle('on', t==='heartbeat');
  $('#tab-queue').classList.toggle('on', t==='queue');
  $('#tab-configuration').classList.toggle('on', t==='configuration');
  $('#j-showdone').classList.toggle('hide', t!=='jobs');     // 各标签专属按钮
  $('#w-order').classList.toggle('hide', t!=='wxbot');
  $('#w-kind').classList.toggle('hide', t!=='wxbot');
  $('#q-state').classList.toggle('hide', t!=='queue');
  $('#c-search').classList.toggle('hide', t!=='configuration');
  if(t==='queue'){
    $('#list').innerHTML='';$('#pane').innerHTML='<div class="empty">载入队列…</div>';loadQueue();
  } else if(t==='configuration'){
    $('#list').innerHTML='';$('#pane').innerHTML='<div class="empty">载入配置…</div>';loadConfiguration();
  } else if(t==='jobs'){
    state.jobUid = 'all';
    $('#pane').innerHTML = '<div class="empty">载入中…</div>';
    loadJobs();
  } else if(t==='groups'){
    state.gUid = 'all';
    $('#pane').innerHTML = '<div class="empty">载入中…</div>';
    loadGroups();
  } else if(t==='heartbeat'){
    $('#pane').innerHTML = '<div class="empty">载入心跳配置…</div>';
    loadHeartbeat();
  } else {
    state.wUid = 'all';
    $('#pane').innerHTML = '<div class="empty">载入中…</div>';
    loadWxbot();
  }
}
$('#tab-wxbot').onclick = ()=>switchTab('wxbot');
$('#tab-jobs').onclick = ()=>switchTab('jobs');
$('#tab-groups').onclick = ()=>switchTab('groups');
$('#tab-heartbeat').onclick = ()=>switchTab('heartbeat');
$('#tab-queue').onclick = ()=>switchTab('queue');
$('#tab-configuration').onclick = ()=>switchTab('configuration');
$('#q-state').onchange=()=>{state.qState=$('#q-state').value;state.qOffset=0;loadQueue();};
$('#c-search').oninput=()=>{state.cSearch=$('#c-search').value;renderConfigurationNav();renderConfigurationPane();};

$('#w-order').onclick = ()=>{
  state.wOrder = state.wOrder==='desc' ? 'asc' : 'desc';
  $('#w-order').textContent = '排序：'+(state.wOrder==='desc'?'倒序（新→旧）':'正序（旧→新）');
  renderWxPane();
};
$('#w-kind').onchange = ()=>{ state.wKind = $('#w-kind').value; renderWxPane(); };
$('#j-showdone').onclick = ()=>{                       // 默认隐藏「已完成」任务
  state.jobShowDone = !state.jobShowDone;
  $('#j-showdone').textContent = state.jobShowDone ? '隐藏已完成' : '显示已完成';
  $('#j-showdone').classList.toggle('on', state.jobShowDone);
  if(state.jobs){ renderJobsNav(); renderJobs(); }
};

function refreshCurrent(){
  if(state.tab==='queue') loadQueue();
  else if(state.tab==='configuration') loadConfiguration();
  else if(state.tab==='jobs') loadJobs();
  else if(state.tab==='groups') loadGroups();
  else if(state.tab==='heartbeat') loadHeartbeat();
  else loadWxbot();
}
$('#b-refresh').onclick = refreshCurrent;
$('#b-auto').onclick = ()=>{
  state.auto = state.auto?0:15;
  $('#b-auto').textContent = '自动刷新：'+(state.auto?state.auto+'s':'关');
  $('#b-auto').classList.toggle('on', !!state.auto);
  clearInterval(state.timer);
  if(state.auto) state.timer = setInterval(refreshCurrent, state.auto*1000);
};

async function boot(){
  const qp = new URLSearchParams(location.search);
  if(qp.get('kind')){ state.wKind = qp.get('kind'); $('#w-kind').value = state.wKind; }
  if(qp.get('worder')==='asc'){ state.wOrder = 'asc'; $('#w-order').textContent = '排序：正序（旧→新）'; }
  const tab = qp.get('tab') || 'wxbot';      // wxbot 通道为第一个标签，默认展示
  switchTab(['jobs','groups','heartbeat','queue','configuration'].includes(tab)?tab:'wxbot');
}
boot();
</script>
</body>
</html>
