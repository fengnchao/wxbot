# 管家配置模板：复制为 config.toml 再改。
# 密钥用脚本写入，别提交进版本库（.gitignore 已含 config.toml）。

[server]
host = "127.0.0.1"
port = 8770
token = ""                    # 必填：wxbot 调管家要带 Bearer，绑 loopback 也要 token

[hermes]
url = "http://127.0.0.1:8642"
api_key = ""                  # = 各 Profile 的 API_SERVER_KEY（命名 Profile 不继承监听者的 key，会 401）
model = "hermes-agent"
timeout = 600                 # 实测一轮慢跑能到 300s+，给足
root = "D:/ai/hermes"         # 读补发队列用（profiles/<p>/skills/messaging/wechat-reminder/scripts）
send_identity = true          # 每条消息前注入 [通道身份]，模型才知道 user_id 归到哪

[wxbot]
url = "http://127.0.0.1:8765" # 主动推送（提醒）走这里
token = ""                    # = wxbot config.toml [outbound].token
timeout = 120

[dispatch]
actions_enabled = true        # 是否解析 <<butler:action {...}>> 标记并执行
script_dir = "D:/bot/scripts"   # 过渡期：本地 skill 脚本所在目录
respond_after_action = false  # 执行完 action 后，是否再把结果交给模型组织成人话

# 联系人 → Hermes Profile / uid。uid 必须 ASCII（会进 HTTP header）。
[[contacts]]
name = "101"                  # 微信独立聊天窗口标题，必须完全一致
profile = "wxbot-101"
uid = "101"
label = "微信联系人101"
