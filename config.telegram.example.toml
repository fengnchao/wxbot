# Copy to config.telegram.toml and enter your OWN Telegram application values locally.
[telegram]
enabled = false
api_id = 0
api_hash = ""
sources = ["@zaobaosg"]
session = "data/telegram/account"
state_dir = "data/telegram"
butler_config = "config.butler.toml"
scan_interval = 10

# Optional explicit proxy for Telegram only; localhost Butler bypasses proxies.
# [proxy]
# type = "socks5"
# host = "127.0.0.1"
# port = 1080
